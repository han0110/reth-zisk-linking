[package]
name = "reth"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)', 'cfg(zisk_hints_debug)', 'cfg(target_vendor, values("zisk"))'] }

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
debug = false
codegen-units = 1

[dependencies]
# Feature-enabling deps on the transitively pulled tree. Versions match the
# ere-guests canonical workspace so cargo unifies to a single resolution.
alloy-consensus = { version = "2.0.5", default-features = false, features = ["crypto-backend"] }
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-foldhash", "native-keccak"] }
revm = { version = "40.0.3", default-features = false }

# Platform trait. Its read_input/write_output default impls call the
# zkvm-standards C ABI symbols that ziskos-staticlib (and SP1's libzkevm) export.
ere-platform-core = { git = "https://github.com/eth-act/ere", tag = "v0.12.2", default-features = false }

# once_cell (pulled transitively by reth) uses critical-section for its no_std
# sync cells; the guest registers a no-op impl since the zkVM is single-threaded.
critical-section = { version = "1", default-features = false }

# Canonical guest logic. The zkvm-interface feature enables the zkvm-standards
# crypto provider and alloy-consensus/crypto-backend.
stateless-validator-reth = { git = "https://github.com/eth-act/ere-guests", branch = "han/feature/canonical-stateless-input", default-features = false, features = ["zkvm-interface"] }
