# Links each EL guest against the chosen zkVM and runs the fixtures in-process.
# SP1 also needs the succinct toolchain to build libzkevm.a.

name: Integration test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zkvm: [zisk, sp1]
        el: [nethermind, reth, zesu]
        fixture: [rpc-bpo2, eest-glamsterdam-devnet-5]
        exclude:
          - zkvm: sp1
            el: nethermind
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            integration-test
            reth
            zisk

      # The harness always builds the ziskemu dependency, so these are needed by every job.
      - name: Install deps
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates xz-utils jq curl build-essential \
            qemu-system libomp-dev libgmp-dev nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev \
            libsecp256k1-dev libsodium-dev libpqxx-dev nasm libopenmpi-dev openmpi-bin openmpi-common libclang-dev \
            clang gcc-riscv64-unknown-elf git libprotobuf-dev lld

      - name: Install succinct toolchain (sp1up)
        if: matrix.zkvm == 'sp1'
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up

      - name: Build guest
        run: make ${{ matrix.el }}_${{ matrix.zkvm }}

      - name: Build integration-test cli
        run: cargo build --release --manifest-path integration-test/Cargo.toml

      - name: Cache fixture archives
        uses: actions/cache@v4
        with:
          path: |
            rpc-bpo2.tar.zst
            fixtures_zkevm.tar.gz
          key: fixtures-${{ hashFiles('download-fixtures.sh') }}

      - name: Download fixtures
        run: |
          ./download-fixtures.sh ${{ matrix.fixture }}

      - name: Run integration-test
        run: |
          set +e
          ./integration-test/target/release/integration-test \
            --zkvm ${{ matrix.zkvm }} --el ${{ matrix.el }} \
            --elf-path ./build/${{ matrix.el }}-${{ matrix.zkvm }}.elf \
            --input-dir ./fixtures/${{ matrix.fixture }} \
            --report ./report.md > /dev/null 2>&1
          status=$?
          # Print only the report, mirror it into the job summary, and keep the run's exit code.
          { cat report.md 2>/dev/null || echo "integration-test produced no report (crashed)"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
