[package]
edition = "2024"
name = "integration-test"
version = "0.1.0"

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.0", features = ["derive"] }
hex = "0.4"
rayon = "1"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2"
zstd = "0.13"

# Canonical guest types from the ere-guests canonical branch (the nethermind IO
# module re-parses input via StatelessInput::from_schema_prefixed_ssz).
stateless-validator-common = { git = "https://github.com/eth-act/ere-guests", branch = "han/feature/canonical-stateless-input" }

sp1-core-executor = "6.3.1"

zisk-core = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }
ziskemu = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }

